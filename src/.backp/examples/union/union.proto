message MySchema {
    oneof target {
        OfficeUserTarget office_user_target = 2;
        PartnershipTarget partnership_target = 3;
    }
}

message OfficeUserTarget {
    string office_key = 1;
    string username = 2;
}

message PartnershipTarget {
    string office_key = 1;
    string company_key = 2;
    string partnership_key = 3;
}
