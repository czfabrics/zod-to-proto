User claude
Group claude

Port 8888
Listen 0.0.0.0
Timeout 600

MaxClients 50
StartServers 2

## Anything the allowlist does not match is refused, rather than the other
## way round
FilterDefaultDeny Yes
FilterExtended On
Filter "/etc/tinyproxy/proxy-allowlist"

## Only TLS: a plaintext tunnel would carry any protocol at all
ConnectPort 443

DisableViaHeader Yes
LogLevel Warning
